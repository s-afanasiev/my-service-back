# Канонический хост. www и кириллический домен редиректятся в Express,
# но nginx-редирект надёжнее (срабатывает до приложения).

server {
    listen 80;
    server_name www.zapravka-k.ru заправка-курск.рф xn----7sbaaj1ayca7blgn0a.xn--p1ai;
    return 301 https://zapravka-k.ru$request_uri;
}

server {
    listen 80;
    server_name zapravka-k.ru _;

    # ── Основной сайт → Express ───────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── pgAdmin → /dbadmin ────────────────────────────────────────────────────
    # Доступ: http://IP/dbadmin/
    # Защита: логин pgAdmin (email + пароль заданные при setup-web.sh)
    location /dbadmin/ {
        proxy_pass         http://127.0.0.1:8080/pgadmin4/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Script-Name     /dbadmin;
    }
}
